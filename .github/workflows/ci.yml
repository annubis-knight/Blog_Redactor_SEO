name: CI

on:
  # Toutes les branches : chaque chantier est vérifié dès qu'il est poussé,
  # avant même l'ouverture de sa PR (épopée qualité SEO, réparation de la CI).
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Type-check + tests unitaires (pas de DB, pas de serveur)
  # ---------------------------------------------------------------------------
  unit:
    name: Type-check + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc (24) : le lock est écrit par npm 11. Il doit aussi être complet
          # pour Linux : écrit sous Windows, il omettait @emnapi/runtime et
          # @emnapi/core (« Missing: … from lock file » à npm ci). Pour le
          # régénérer comme la CI le lit :
          #   docker run --rm -v <dépôt>:/w -w /w node:24 npm install --package-lock-only --ignore-scripts
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run verify:types

      # data.service.test.ts lit les DONNÉES de la base de développement (« le premier
      # cocon est Croissance digitale Toulouse ») : ni portable ici (pas de base), ni en
      # intégration (base vide). À réécrire avec des fixtures (épopée qualité SEO, T9).
      - name: Tests unitaires (unit + functional uniquement, pas de DB)
        run: npx vitest run tests/unit tests/functional --reporter=dot --exclude tests/unit/services/data.service.test.ts
        env:
          AI_PROVIDER: mock

  # ---------------------------------------------------------------------------
  # Job 2: Tests e2e + integration + contract (DB postgres + serveur dev)
  # ---------------------------------------------------------------------------
  integration:
    name: Integration + e2e (DB + serveur)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Même version que les postes de dev : bootstrap.sql est produit par pg_dump 18.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog_redactor_seo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc (24) : le lock est écrit par npm 11. Il doit aussi être complet
          # pour Linux : écrit sous Windows, il omettait @emnapi/runtime et
          # @emnapi/core (« Missing: … from lock file » à npm ci). Pour le
          # régénérer comme la CI le lit :
          #   docker run --rm -v <dépôt>:/w -w /w node:24 npm install --package-lock-only --ignore-scripts
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare .env for CI
        env:
          DFS_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DFS_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          cat > .env <<'EOF'
          # 3400 : une douzaine de tests visent http://localhost:3400 en dur (NFR-CFG-APP-PORTS).
          PORT=3400
          PG_HOST=localhost
          PG_PORT=5432
          PG_USER=postgres
          PG_PASSWORD=postgres
          PG_DATABASE=blog_redactor_seo_test
          AI_PROVIDER=mock
          MOCK_LATENCY_MS=50
          DATAFORSEO_SANDBOX=true
          DATAFORSEO_LOGIN=test
          DATAFORSEO_PASSWORD=test
          ANTHROPIC_API_KEY=dummy
          EOF
          # DataForSEO : même le bac à sable (gratuit) exige de vrais identifiants,
          # à poser en secrets du dépôt (DATAFORSEO_LOGIN, DATAFORSEO_PASSWORD).
          # Sans eux, les tests qui mesurent un mot-clé se déclarent ignorés
          # (tests/helpers/external-sources.ts), et le passage le signale.
          if [ -n "$DFS_LOGIN" ]; then
            sed -i '/^DATAFORSEO_\(LOGIN\|PASSWORD\)=/d' .env
            printf 'DATAFORSEO_LOGIN=%s\nDATAFORSEO_PASSWORD=%s\n' "$DFS_LOGIN" "$DFS_PASSWORD" >> .env
          else
            echo "::warning::DataForSEO non configuré (secrets DATAFORSEO_LOGIN / DATAFORSEO_PASSWORD absents) : les tests qui mesurent un mot-clé sont ignorés."
          fi

      # Les migrations sont archivées depuis mai : la boucle sur migrations/*.sql
      # ne créait plus aucune table. Le schéma rejouable est bootstrap.sql
      # (npm run db:bootstrap), et ON_ERROR_STOP fait échouer l'étape au premier souci.
      - name: Create DB schema
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d blog_redactor_seo_test -v ON_ERROR_STOP=1 -q -f server/db/bootstrap.sql

      - name: Seed minimal DB (silo)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d blog_redactor_seo_test -v ON_ERROR_STOP=1 <<'EOF'
          INSERT INTO silos (nom, description) VALUES
            ('Stratégie & Visibilité', 'CI test silo')
          ON CONFLICT DO NOTHING;
          EOF

      - name: Start dev server (background)
        run: |
          nohup node --env-file=.env --import=tsx/esm server/index.ts > server.log 2>&1 &
          echo $! > server.pid
          # Wait for server ready
          for i in {1..30}; do
            if curl -sf http://localhost:3400/api/health > /dev/null 2>&1; then
              echo "Server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start"
          cat server.log
          exit 1

      - name: Tests contract + integration + e2e
        run: npx vitest run tests/contract-api tests/integration-tabs tests/e2e-workflows --reporter=dot
        env:
          AI_PROVIDER: mock
          TEST_BASE_URL: http://localhost:3400/api

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: server.log

  # ---------------------------------------------------------------------------
  # Job 3: Tests Playwright (browser)
  # ---------------------------------------------------------------------------
  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: integration  # Ne lance pas browser si integration casse (gain de temps)

    services:
      postgres:
        # Même version que les postes de dev : bootstrap.sql est produit par pg_dump 18.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog_redactor_seo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc (24) : le lock est écrit par npm 11. Il doit aussi être complet
          # pour Linux : écrit sous Windows, il omettait @emnapi/runtime et
          # @emnapi/core (« Missing: … from lock file » à npm ci). Pour le
          # régénérer comme la CI le lit :
          #   docker run --rm -v <dépôt>:/w -w /w node:24 npm install --package-lock-only --ignore-scripts
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Prepare .env for CI
        env:
          DFS_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DFS_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          cat > .env <<'EOF'
          # Les tests navigateur démarrent leur propre serveur sur leurs ports dédiés
          # (playwright.config.ts : E2E_SERVER_PORT, par défaut 3410), qui priment sur .env.
          PORT=3410
          PG_HOST=localhost
          PG_PORT=5432
          PG_USER=postgres
          PG_PASSWORD=postgres
          PG_DATABASE=blog_redactor_seo_test
          AI_PROVIDER=mock
          MOCK_LATENCY_MS=50
          DATAFORSEO_SANDBOX=true
          DATAFORSEO_LOGIN=test
          DATAFORSEO_PASSWORD=test
          ANTHROPIC_API_KEY=dummy
          EOF
          # DataForSEO : même le bac à sable (gratuit) exige de vrais identifiants,
          # à poser en secrets du dépôt (DATAFORSEO_LOGIN, DATAFORSEO_PASSWORD).
          # Sans eux, les tests qui mesurent un mot-clé se déclarent ignorés
          # (tests/helpers/external-sources.ts), et le passage le signale.
          if [ -n "$DFS_LOGIN" ]; then
            sed -i '/^DATAFORSEO_\(LOGIN\|PASSWORD\)=/d' .env
            printf 'DATAFORSEO_LOGIN=%s\nDATAFORSEO_PASSWORD=%s\n' "$DFS_LOGIN" "$DFS_PASSWORD" >> .env
          else
            echo "::warning::DataForSEO non configuré (secrets DATAFORSEO_LOGIN / DATAFORSEO_PASSWORD absents) : les tests qui mesurent un mot-clé sont ignorés."
          fi

      # Les migrations sont archivées depuis mai : la boucle sur migrations/*.sql
      # ne créait plus aucune table. Le schéma rejouable est bootstrap.sql
      # (npm run db:bootstrap), et ON_ERROR_STOP fait échouer l'étape au premier souci.
      - name: Create DB schema
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d blog_redactor_seo_test -v ON_ERROR_STOP=1 -q -f server/db/bootstrap.sql

      - name: Seed minimal DB (silo)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d blog_redactor_seo_test -v ON_ERROR_STOP=1 <<'EOF'
          INSERT INTO silos (nom, description) VALUES ('Stratégie & Visibilité', 'CI test silo')
          ON CONFLICT DO NOTHING;
          EOF

      - name: DataForSEO configuré ?
        id: dfs
        env:
          DFS_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
        run: echo "ok=$([ -n "$DFS_LOGIN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Les parcours navigateur verrouillent des capitaines, donc mesurent des
      # mots-clés : sans DataForSEO, ils échoueraient pour une raison étrangère
      # au produit. Ils sont alors ignorés, et le passage l'affiche.
      - name: Tests navigateur ignorés (DataForSEO non configuré)
        if: steps.dfs.outputs.ok != 'true'
        run: |
          echo "::warning::Tests navigateur ignorés : DataForSEO non configuré (secrets DATAFORSEO_LOGIN / DATAFORSEO_PASSWORD)."

      - name: Run Playwright tests (auto-starts dev servers)
        if: steps.dfs.outputs.ok == 'true'
        run: npx playwright test --reporter=github
        env:
          AI_PROVIDER: mock

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
